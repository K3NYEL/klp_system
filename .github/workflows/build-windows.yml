name: Build KLP SYSTEM - Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Crear entorno virtual
        shell: pwsh
        run: |
          python -m venv .venv

      - name: Actualizar pip
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install `
            customtkinter `
            pillow `
            reportlab `
            bcrypt `
            pyinstaller

      - name: Compilar KLP SYSTEM
        shell: cmd
        run: |
          build.bat

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\klp_system.exe")) {
            Write-Error "No se encontró dist\klp_system.exe"
            exit 1
          }

          Get-Item "dist\klp_system.exe" | Format-List Name,Length,FullName

      - name: Publicar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: KLP-System-Windows
          path: dist/klp_system.exe
          if-no-files-found: error
